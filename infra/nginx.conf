# LipSync Studio — reverse proxy.
#
# Terminates TLS, routes the web app and API, and carries the WebSocket
# upgrade for render progress. Sized for large uploads and long renders.

upstream lipsync_web {
    server web:3000;
    keepalive 32;
}

upstream lipsync_api {
    server api:4000;
    keepalive 32;
}

# Belt-and-braces alongside the API's own limiter: this one survives an API
# restart and costs nothing per request.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # ACME challenges must stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name lipsyncstudio.app;

    ssl_certificate     /etc/letsencrypt/live/lipsyncstudio.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lipsyncstudio.app/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Video uploads run to several gigabytes. Streaming them rather than
    # buffering to disk keeps nginx from becoming the bottleneck.
    client_max_body_size 4G;
    client_body_timeout 300s;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    # Video and images are already compressed; gzipping them burns CPU for
    # nothing, so they are not in the type list above.

    location /realtime/ {
        proxy_pass http://lipsync_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A socket sits idle between progress updates; the default 60s would
        # disconnect every client mid-render.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://lipsync_api;
        include /etc/nginx/proxy_params_lipsync;
    }

    location /v1/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://lipsync_api;
        include /etc/nginx/proxy_params_lipsync;
        # Renders are submitted synchronously by the worker path; give them room.
        proxy_read_timeout 600s;
    }

    location /media/ {
        proxy_pass http://lipsync_api;
        include /etc/nginx/proxy_params_lipsync;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "private, max-age=3600";
    }

    location /health {
        access_log off;
        proxy_pass http://lipsync_api;
        include /etc/nginx/proxy_params_lipsync;
    }

    # Next.js emits content-hashed filenames under /_next/static, so they are
    # safe to cache forever.
    location /_next/static/ {
        proxy_pass http://lipsync_web;
        include /etc/nginx/proxy_params_lipsync;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://lipsync_web;
        include /etc/nginx/proxy_params_lipsync;
    }
}
