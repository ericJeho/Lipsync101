apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Release signing.
//
// Read from an untracked keystore.properties, or from environment variables so
// CI can sign without a file on disk. When neither is present the release build
// still runs and produces an unsigned APK — useful for verifying the build
// itself, not installable until signed.
// ---------------------------------------------------------------------------
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def keystorePath = hasKeystoreFile
    ? keystoreProperties['storeFile']
    : System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = hasKeystoreFile
    ? keystoreProperties['storePassword']
    : System.getenv('ANDROID_KEYSTORE_PASSWORD')
def keystoreAlias = hasKeystoreFile
    ? keystoreProperties['keyAlias']
    : System.getenv('ANDROID_KEY_ALIAS')
def keystoreAliasPassword = hasKeystoreFile
    ? keystoreProperties['keyPassword']
    : System.getenv('ANDROID_KEY_PASSWORD')

def canSign = keystorePath != null && !keystorePath.isEmpty() && file(keystorePath).exists()

android {
    namespace "app.lipsyncstudio.mobile"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "app.lipsyncstudio.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // CI overrides these so every build is uniquely versioned; Play refuses
        // a second upload with a versionCode it has already seen.
        versionCode System.getenv('ANDROID_VERSION_CODE')
            ? System.getenv('ANDROID_VERSION_CODE').toInteger()
            : 1
        versionName System.getenv('ANDROID_VERSION_NAME') ?: "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (canSign) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keystoreAlias
                keyPassword keystoreAliasPassword
                // v1 as well as v2/v3: v1 is what lets the APK install on the
                // older devices minSdk still admits.
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            // Left off deliberately. Capacitor bridges JavaScript to native over
            // reflection, and R8 without a carefully maintained keep-list strips
            // exactly what the bridge looks up at runtime — the failure mode is
            // a release build that installs and then shows a blank screen.
            // Turn it on only with a device to test against.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (canSign) {
                signingConfig signingConfigs.release
            }
        }

        debug {
            // So a debug build can sit alongside a release install on the same
            // handset without one replacing the other.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }

    lintOptions {
        // A lint warning should not stop an APK from being produced in CI.
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
